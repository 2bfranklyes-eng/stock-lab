name: Supabase 휴면 방지

# 왜 별도 워크플로인가 —
# refresh.yml·refresh_kr.yml·screener.yml 이 이미 매일 Supabase를 두드리므로
# 평시엔 이 파일이 할 일이 없다. 이건 그 크론들이 '통째로 멈췄을 때'를 위한 안전망이다.
#   · 파이프라인이 연속 실패(야후·KRX·ECOS 장애, 키 만료)하면 Supabase 요청이 0이 된다
#   · 무료 프로젝트는 요청 없는 상태가 7일 이어지면 일시정지되고, 깨우려면 수동 재개가 필요하다
# 그래서 외부 API·시크릿에 하나도 기대지 않는 요청 하나만 남겨둔다. 파이프라인이 다 죽어도 이건 산다.

on:
  schedule:
    # 월·수·금 03:00 UTC (한국 정오). 간격이 2~3일이라 한 회차가 실패해도 최대 5일 —
    # 7일 한도 안에 여유가 남는다. 매일 돌릴 이유는 없다(요청 1건이면 하루치 활동으로 충분).
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase에 읽기 요청 보내기
        env:
          # anon 키는 공개용이다 — RLS로 보호되고 web/.env.production 에 이미 커밋돼 있어
          # 여기 적어도 새로 노출되는 게 없다. service_role 키를 쓰면 안 된다.
          #
          # 굳이 시크릿을 안 쓰는 이유: 이 워크플로의 존재 이유가 '다른 게 다 고장났을 때'인데
          # 시크릿에 의존하면 시크릿 만료·삭제라는 고장 원인을 하나 더 떠안게 된다.
          SUPABASE_URL: https://hffuxqijuoempxeblddx.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmZnV4cWlqdW9lbXB4ZWJsZGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3NDk5MDcsImV4cCI6MjEwMDMyNTkwN30.WgQJHcMfEa9TAmds9Vn9hEr96prifKGEpGZH06Qjvn8
        run: |
          set -uo pipefail

          # 읽기만 한다(GET). 가짜 행을 넣지 않는 이유 —
          # 휴면 판정은 '요청이 있었나'로 갈리므로 SELECT 한 번이면 충분한데,
          # INSERT 를 하면 500MB 무료 한도(현재 60~70%대)를 야금야금 먹고
          # sentiment_daily 에 실제가 아닌 행이 섞여 대시보드·백테스트가 오염된다.
          # limit=1 + 컬럼 1개라 응답은 수십 바이트다.
          URL="$SUPABASE_URL/rest/v1/sentiment_daily?select=dt&order=dt.desc&limit=1"

          for i in 1 2 3; do
            BODY=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$URL") && {
                CODE=$(printf '%s' "$BODY" | tail -n1)
                DATA=$(printf '%s' "$BODY" | sed '$d')
                if [ "$CODE" = "200" ]; then
                  echo "✅ Supabase 응답 정상 — 최신 심리점수 날짜: $DATA"
                  exit 0
                fi
                echo "⚠️ ${i}회차 실패 (HTTP $CODE): $DATA"
              } || echo "⚠️ ${i}회차 curl 자체가 실패"
            [ "$i" -lt 3 ] && sleep 20
          done

          # 3번 다 실패 = 프로젝트가 이미 정지됐거나 키가 무효다. 조용히 넘기면
          # 안전망이 죽은 걸 모르게 되므로 job 을 빨갛게 실패시켜 메일이 오게 한다.
          echo "❌ 3회 모두 실패. Supabase 대시보드에서 프로젝트 상태와 anon 키를 확인할 것."
          exit 1
