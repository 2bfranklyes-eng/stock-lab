name: 한국 마감 반영 (오후)

# 왜 따로 있나 — refresh.yml(아침 크론)은 '미국 장 마감 후'에 맞춰 한국시간 오전 7시에 돈다.
# 그래서 한국장이 15:30에 닫혀도 지표는 다음 날 아침에야 들어오고, 저녁에 대시보드를 열면
# 늘 어제 것이 보였다. 게다가 아침 크론은 22:00 UTC 월~금(=한국 화~토 오전)이라
# 토요일 아침 이후 화요일 아침까지 72시간 공백이 생겨, 월요일 저녁엔 목요일 지수를 보게 됐다.
# 이 워크플로가 그 공백을 메운다.
#
# 여기서 안 도는 것: krx.py·profile.py·holders.py·ai_cycle.py.
#   KRX 일별매매정보는 이 시각(오후 6시)에 아직 미공개라(실측: 17:35에 0종목) 받을 게 없다.
#   개별종목·매물대는 아침 크론이 담당한다.
on:
  # ⏸ Supabase 창고(hffuxqijuoempxeblddx)를 휴면시킨 동안 자동 실행을 멈춘다 (2026-09-02).
  #    켜 둔 채 창고를 정지하면 회차마다 실패해 실패 알림만 쌓인다.
  #    창고를 재개하면 아래 schedule 주석을 풀 것 — refresh 는 '마지막 저장일 + 1일'부터
  #    이어받는 증분 구조라(krx.py·holders.py) 쉰 기간은 첫 실행에서 저절로 메워진다.
  # schedule:
  #   # 평일 09:00 UTC = 한국 오후 6시. 코스피 마감(15:30) + 야후 반영 지연을 넉넉히 넘긴 시각.
  #   - cron: '0 9 * * 1-5'
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  refresh-kr:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://hffuxqijuoempxeblddx.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python ingest.py        # 이 시각이면 야후에 코스피·코스닥 당일 종가가 올라와 있다
      - run: python prices.py        # 비교 탭용 price_daily
      - run: python sentiment.py     # S(t) — 한국은 당일, 미국은 전 거래일 기준이 된다
      - run: python liquidity.py     # L(t)
      - run: python inflation.py     # I(t)
      - run: python backtest.py            # 밴드 통계도 같이 — 게이지와 표의 기준일을 맞춘다
      - run: python liquidity_backtest.py
      - run: python inflation_backtest.py
      - run: python allocation.py          # 국면 + 자산 위치
      - run: python allocation_backtest.py
      - run: python allocation_shock.py
