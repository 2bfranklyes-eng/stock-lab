name: 데이터 자동 갱신

on:
  schedule:
    # 화~토 00:00 UTC (한국 오전 9시) — 미국 장 마감 후 + KRX 일별매매정보 공개 후.
    #
    # 왜 오전 9시인가 — 예전엔 22:00 UTC(한국 오전 7시)였는데, KRX 일별매매정보는 그 시각에
    # 아직 안 올라온다. 성공한 회차는 전부 한국시간 08:11~08:14에 돌았고(깃허브 큐 지연이
    # 우연히 밀어준 것), 지연이 47분뿐이라 07:49에 돈 2026-08-07 회차는 금요일치를 빈 응답으로
    # 받아 놓쳤다. 즉 크론 시각이 공개 시각보다 일러 '지연 운'에 기대던 구조였다.
    # 공개 시각(≈08:00 KST) 대비 1시간 여유를 두고, 요일도 화~토로 옮겨 금요일치가
    # 토요일 아침에 제대로 들어오게 한다. (월~금 22:00 UTC 시절엔 토요일 아침 회차가
    # 금요일치를 놓치면 다음 시도가 화요일 오전이라 나흘을 비웠다.)
    - cron: '0 0 * * 2-6'
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://hffuxqijuoempxeblddx.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}   # 한국 국내 금리(국고채·회사채) + 실탄(M2·수급) 수집용
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 미국 실탄(Fed 순유동성) 수집용
      KRX_API_KEY: ${{ secrets.KRX_API_KEY }}     # KRX 실제 회전율(매물대 정밀화) — 없으면 프록시로 동작
      KRX_ID: ${{ secrets.KRX_ID }}               # KRX 정보데이터시스템 로그인 — 주체별 실측(holders.py)용
      KRX_PW: ${{ secrets.KRX_PW }}               # 시크릿 미설정이면 holders.py가 스스로 건너뜀
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python ingest.py       # 원천 지표 수집 (미국+한국: 심리·유동성 지표)
      # krx.py가 prices.py보다 먼저다 — KRX 지수 종가로 야후의 하루 지연을 덮어쓴 뒤라야
      # price_daily(비교 탭)와 아래 지표들이 같은 최신일을 본다.
      - run: python krx.py           # KRX 실제 회전율 + 지수 종가 보정 + 워치리스트 종목 일별시세
      - run: python prices.py        # 대표 지수(us_index/kr_index) → 공개용 price_daily (비교 탭용)
      - run: python profile.py --push    # 지수 매물대 → volume_profile (매물대 탭용)
      - run: python profile.py --stocks  # 개별종목 매물대 → volume_profile
      - run: python holders.py       # 주체별 실측 매물대 → holder_profile (시크릿 없으면 자동 스킵)
        continue-on-error: true      # 정보데이터시스템 스크래핑 실패가 다른 갱신을 막지 않게
      # holders.py가 채운 investor_flow를 되감아 '누가 얼마나 물렸나'의 시계열을 만든다.
      # 매번 전 기간을 다시 계산해 upsert한다 — 결과가 2,500행대라 비용이 작고,
      # 중간에 원자료가 보정되면 과거까지 알아서 따라 고쳐진다.
      - run: python cgo.py           # 주체별 미실현손익(CGO) 시계열 → cgo_daily
      - run: python sentiment.py     # S(t) 심리점수 계산 → sentiment_daily
      - run: python liquidity.py     # L(t) 유동성 지수 계산 → liquidity_daily
      - run: python inflation.py     # I(t) 물가 지수 계산 → inflation_daily
      - run: python backtest.py      # 심리 밴드별 통계 → backtest_stats
      - run: python liquidity_backtest.py  # 유동성 밴드별 통계 → liquidity_backtest_stats
      - run: python inflation_backtest.py  # 물가 밴드별 통계 → inflation_backtest_stats
      - run: python allocation.py    # 자산배분 국면 + 자산 위치 점수 → regime_daily·asset_daily (inflation 다음)
      - run: python allocation_backtest.py  # 국면별 자산 통계 → asset_regime_stats
      - run: python allocation_shock.py     # 충격완화 통계(급락월·위기 리플레이) → asset_shock_stats
      - run: python fuel.py          # F(t) 실탄 지수 (미국 주간 FRED / 한국 월간 ECOS) → fuel_index
      - run: python fuel_backtest.py  # 실탄 밴드별 통계 → fuel_backtest_stats
      - run: python ai_cycle.py      # AI 사이클 계기판 (반도체 밸류체인 상대강도) → ai_daily
