name: 종목 스크리너 갱신

# 주 1회면 충분하다 — 재무는 분기 단위로만 바뀌고, 실적 발표(분기말+45일)에서
# 야후 반영까지 며칠~2주가 더 걸린다. 매일 돌리면 500종목 × .info 호출로 차단당할 위험만 커진다.
on:
  schedule:
    # 금 23:00 UTC = 토 08:00 KST — 한 주 거래가 모두 끝난 뒤
    - cron: '0 23 * * 5'
  workflow_dispatch: {}   # 수동 실행 버튼

jobs:
  screener:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://hffuxqijuoempxeblddx.supabase.co
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SCREENER_TOP_N: '500'
      # 유니버스(시총 상위) 밖이어도 반드시 포함할 종목코드. 보유 종목을 여기 넣으면 된다.
      SCREENER_ALWAYS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python screener.py
